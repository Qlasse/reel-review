<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Правила и настройки</title>
<style>
:root { --bg: #0f1012; --panel: #17181b; --panel2: #1f2024; --line: #2c2e33; --text: #e9e9ea; --dim: #9a9ca3;
  --mark: #ff5a36; --ok: #3ccf7e; --warn: #ffb020; }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
  font: 14px/1.45 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", sans-serif; }
button, select, textarea, input { font: inherit; color: inherit; }
button { background: var(--panel2); border: 1px solid var(--line); border-radius: 8px; padding: 6px 12px; cursor: pointer; }
button:hover { border-color: #4a4d55; }
button.on { background: #fff; color: #111; border-color: #fff; }
button.primary { background: var(--mark); border-color: var(--mark); color: #fff; font-weight: 600; }
button:disabled { opacity: .4; cursor: default; }
.app { display: grid; grid-template-columns: 260px 1fr; height: 100vh; }
aside { background: var(--panel); border-right: 1px solid var(--line); padding: 12px; overflow: auto; }
main { display: flex; flex-direction: column; min-width: 0; padding: 12px 16px; gap: 10px; }
h1 { font-size: 13px; letter-spacing: .04em; text-transform: uppercase; color: var(--dim); margin: 4px 0 10px; font-weight: 600; }
.tabs { display: flex; gap: 6px; margin-bottom: 12px; }
.file { padding: 7px 9px; border-radius: 8px; cursor: pointer; }
.file:hover { background: var(--panel2); } .file.cur { background: #2a2c31; }
.file small { display: block; color: var(--dim); font-size: 11px; word-break: break-all; }
textarea#ed { flex: 1; min-height: 0; width: 100%; resize: none; background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
  padding: 12px 14px; font: 13px/1.55 ui-monospace, Menlo, monospace; tab-size: 2; }
.bar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.hint { color: var(--dim); font-size: 12px; }
.msg { font-size: 12px; min-height: 16px; } .msg.ok { color: var(--ok); } .msg.err { color: var(--mark); } .msg.dirty { color: var(--warn); }
form { display: grid; gap: 16px; max-width: 640px; }
label { display: grid; gap: 5px; }
label b { font-weight: 600; }
select, input[type=text], input[type=number], form textarea { background: var(--panel2); border: 1px solid var(--line); border-radius: 8px; padding: 7px 9px; }
form textarea { min-height: 90px; resize: vertical; }
.card { border: 1px solid var(--line); border-radius: 10px; padding: 12px; background: var(--panel); }
code { font: 12px ui-monospace, Menlo, monospace; background: var(--panel2); padding: 1px 5px; border-radius: 4px; }
[hidden] { display: none !important; }
@media (max-width: 800px) { .app { grid-template-columns: 1fr; height: auto; } aside { max-height: 220px; } textarea#ed { min-height: 60vh; } }
</style>
</head>
<body>
<div class="app">
  <aside>
    <div class="tabs"><button id="t-rules" class="on">Правила</button><button id="t-set">Настройки</button></div>
    <div id="files"></div>
    <p class="hint">Правила читает Claude: CLAUDE.md — в начале каждой сессии, rules.md и каталог — когда берётся за ролик бренда.</p>
  </aside>

  <main id="p-rules">
    <div class="bar"><h1 id="ftitle" style="margin:0">—</h1><span class="hint" id="fpath"></span></div>
    <textarea id="ed" spellcheck="false" aria-label="Текст правил"></textarea>
    <div class="bar">
      <button class="primary" id="save" disabled>Сохранить <span class="hint" style="color:inherit">⌘S</span></button>
      <button id="reload">Перечитать с диска</button>
      <span class="msg" id="msg"></span>
    </div>
  </main>

  <main id="p-set" hidden>
    <h1>Настройки страницы</h1>
    <div class="card" id="authbox">Проверяю вход Claude…</div>
    <form id="sf">
      <label><b>Модель Claude</b>
        <input type="text" name="model" list="models" placeholder="по умолчанию аккаунта">
        <datalist id="models"><option value="opus"><option value="sonnet"><option value="haiku"></datalist>
        <span class="hint">Пусто — модель по умолчанию. sonnet дешевле и быстрее на мелких правках, opus — на графике и разборе.</span></label>
      <label><b>Усилие (effort)</b><select name="effort"></select>
        <span class="hint">Пусто — по умолчанию. Выше — дольше думает, дороже, лучше на сложной графике.</span></label>
      <label><b>Права Claude без чата</b><select name="permission_mode"></select>
        <span class="hint">auto — как в приложении: безопасное сам, опасное отклоняет. acceptEdits — правит файлы, но команды (рендер, ffmpeg) отклоняются.
        bypassPermissions — всё без спроса, включая удаление.</span></label>
      <label><b>Потолок расходов за запуск, $</b><input type="number" name="max_budget_usd" min="0" step="0.5">
        <span class="hint">0 — без потолка. При подписке тратит лимиты подписки, а не деньги.</span></label>
      <label><b>Размер клипа предпросмотра</b><input type="number" name="preview_scale" min="0.2" max="1" step="0.1">
        <span class="hint">0.5 — 540×960, быстро. 1 — полный кадр, примерно вдвое дольше. Стоп-кадры всегда в полный размер.</span></label>
      <label><b>Выключать сервер без работы через, мин</b><input type="number" name="idle_minutes" min="0" max="1440" step="5">
        <span class="hint">Без работы — страница закрыта, а Claude, рендер и проверка не идут. 0 — не выключать. Включить снова — той же командой запуска.</span></label>
      <label><b>Добавлять к каждому заданию</b><textarea name="extra_prompt" placeholder="Например: «Отчёт в ленте — по-русски, не длиннее пяти строк»."></textarea></label>
      <div class="bar"><button class="primary" type="submit">Сохранить настройки</button><span class="msg" id="smsg"></span></div>
    </form>
  </main>
</div>

<script>
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const api = async (path, body) => {
  const r = await fetch(path, body ? { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) } : {});
  const j = await r.json().catch(() => ({}));
  if (!r.ok) { const e = new Error(j.error || r.status); e.status = r.status; e.data = j; throw e; }
  return j;
};
const S = { files: [], cur: null, mtime: 0, orig: "" };
const dirty = () => S.cur && $("#ed").value !== S.orig;
const msg = (t, cls = "") => { $("#msg").textContent = t; $("#msg").className = "msg " + cls; };

function drawFiles() {
  $("#files").innerHTML = S.files.map((f) => `<div class="file${f.path === S.cur ? " cur" : ""}" data-p="${esc(f.path)}">${esc(f.title)}<small>${esc(f.path)}</small></div>`).join("");
}
function put(d) {
  S.cur = d.path; S.mtime = d.mtime; S.orig = d.text;
  $("#ed").value = d.text;
  const f = S.files.find((x) => x.path === d.path);
  $("#ftitle").textContent = f ? f.title : d.path; $("#fpath").textContent = d.path;
  $("#save").disabled = true; drawFiles();
}
async function openFile(p, force) {
  if (!force && dirty() && !confirm("Есть несохранённые правки. Уйти без сохранения?")) return;
  put(await api("/api/rule?path=" + encodeURIComponent(p)));
  msg("");
  history.replaceState(null, "", "#" + encodeURIComponent(p));
}
async function save() {
  if (!dirty()) return;
  try {
    put(await api("/api/rule", { path: S.cur, text: $("#ed").value, mtime: S.mtime }));
    msg("сохранено " + new Date().toLocaleTimeString("ru", { hour: "2-digit", minute: "2-digit" }), "ok");
  } catch (e) {
    if (e.status === 409) {
      const mine = $("#ed").value;
      navigator.clipboard?.writeText(mine).catch(() => {});
      put(e.data);
      msg("Файл поменяли, пока вы правили. Загружен свежий текст, ваша версия скопирована в буфер — перенесите правки.", "err");
    } else msg("не сохранилось: " + e.message, "err");
  }
}
$("#files").addEventListener("click", (e) => { const el = e.target.closest(".file"); if (el) openFile(el.dataset.p); });
$("#ed").addEventListener("input", () => { $("#save").disabled = !dirty(); msg(dirty() ? "есть несохранённые правки" : "", dirty() ? "dirty" : ""); });
$("#save").onclick = save;
$("#reload").onclick = () => S.cur && openFile(S.cur);
window.addEventListener("keydown", (e) => { if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "s") { e.preventDefault(); save(); } });
window.addEventListener("beforeunload", (e) => { if (dirty()) { e.preventDefault(); e.returnValue = ""; } });
// файл поменяли на диске (Claude дописал правило), а вы не правите — подтянуть
setInterval(async () => {
  if (!S.cur || dirty() || $("#p-rules").hidden) return;
  const d = await api("/api/rule?path=" + encodeURIComponent(S.cur)).catch(() => null);
  if (d && d.mtime !== S.mtime) { put(d); msg("обновлено с диска", "ok"); }
}, 5000);

// ---------- вкладки ----------
function tab(t) {
  $("#p-rules").hidden = t !== "rules"; $("#p-set").hidden = t !== "set";
  $("#t-rules").classList.toggle("on", t === "rules"); $("#t-set").classList.toggle("on", t === "set");
  $("#files").hidden = t !== "rules";
  if (t === "set") loadSettings();
}
$("#t-rules").onclick = () => tab("rules");
$("#t-set").onclick = () => tab("set");

// ---------- настройки ----------
async function loadSettings() {
  const d = await api("/api/settings");
  const f = $("#sf");
  for (const [k, opts] of Object.entries(d.choices)) f[k].innerHTML = opts.map((o) => `<option value="${o}">${o || "по умолчанию"}</option>`).join("");
  for (const [k, v] of Object.entries(d.settings)) if (f[k]) f[k].value = v;
  const setup = `Один раз в Терминале: <code>claude setup-token</code> — выдаст ключ подписки. Скопируйте ключ целиком (он печатается на двух строках),
    затем <code>python3 "${esc(d.scripts)}/jobs.py" key</code> — команда возьмёт ключ из буфера обмена, положит в Связку ключей macOS и проверит, что Claude его принимает. Потом обновите эту вкладку.`;
  $("#authbox").innerHTML = (d.auth.token
    ? `<b style="color:var(--ok)">Claude входит по долгоживущему ключу.</b> Годен ли ключ, покажет первый запуск со страницы. Запуски тратят лимиты подписки.`
    : d.auth.ok
    ? `<b style="color:var(--warn)">Claude вошёл обычным входом</b> — он может слететь за ночь. Надёжнее ключ: ${setup}`
    : `<b style="color:var(--mark)">Консольный claude не вошёл.</b> ${setup}`) +
    `<div class="hint" style="margin-top:6px">${d.plugin ? "Плагин it-reelsmaker найден, Claude получит его скилл." : "Плагин it-reelsmaker не найден: Claude без чата не увидит его скилл."}</div>`;
}
$("#sf").addEventListener("submit", async (e) => {
  e.preventDefault();
  const f = e.target, body = Object.fromEntries(new FormData(f));
  try { await api("/api/settings", body); $("#smsg").textContent = "сохранено"; $("#smsg").className = "msg ok"; }
  catch (err) { $("#smsg").textContent = err.message; $("#smsg").className = "msg err"; }
});

(async () => {
  S.files = await api("/api/rules");
  drawFiles();
  const want = decodeURIComponent(location.hash.slice(1));
  await openFile(S.files.some((f) => f.path === want) ? want : S.files[0].path, true);
})();
</script>
</body>
</html>
