<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Пометки на кадре</title>
<style>
:root {
  color-scheme: dark;
  --bg: #0f1012; --panel: #16171a; --raise: #1f2024; --raise2: #282a2f; --line: #2c2e33; --line2: #3a3d44;
  --text: #ececed; --dim: #a1a3aa; --faint: #6e717a;
  --mark: #ff5a36; --draft: #ffd400; --ok: #3ccf7e; --ask: #6aa8ff; --warn: #ffb020;
  --r: 8px;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
  font: 14px/1.45 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", sans-serif; }
::selection { background: rgba(255, 90, 54, .35); }
* { scrollbar-width: thin; scrollbar-color: var(--line2) transparent; }
:focus-visible { outline: 2px solid var(--ask); outline-offset: 2px; }
button, select, textarea, input { font: inherit; color: inherit; caret-color: var(--mark); }
button { display: inline-flex; align-items: center; justify-content: center; gap: 6px; background: var(--raise); border: 1px solid var(--line);
  border-radius: var(--r); padding: 6px 11px; cursor: pointer; transition: background .12s, border-color .12s, color .12s; }
button:hover:not(:disabled) { border-color: var(--line2); background: var(--raise2); }
button.on { background: var(--text); color: var(--bg); border-color: var(--text); }
button.primary { background: var(--mark); border-color: var(--mark); color: #fff; font-weight: 600; }
button.primary:hover:not(:disabled) { background: #ff6c4c; border-color: #ff6c4c; }
button.danger { background: #3a1611; border-color: #6b2a1d; color: #ffb4a3; font-weight: 600; }
button:disabled { opacity: .4; cursor: default; }
button.icon { padding: 6px; width: 34px; height: 34px; }
button.ghost { background: none; border-color: transparent; color: var(--dim); }
button.ghost:hover:not(:disabled) { color: var(--text); background: var(--raise); }
svg { width: 18px; height: 18px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
input, select, textarea { background: var(--raise); border: 1px solid var(--line); border-radius: var(--r); padding: 7px 9px; }
input:focus, select:focus, textarea:focus { border-color: var(--line2); outline: none; }
textarea { width: 100%; resize: vertical; }
[hidden] { display: none !important; }
.grow { flex: 1; }
.dim { color: var(--dim); } .small { font-size: 11px; }
.num { font-variant-numeric: tabular-nums; }

.app { display: grid; grid-template-columns: 232px 1fr 340px; grid-template-rows: 100vh; height: 100vh; }

/* ---------- ролики ---------- */
aside { background: var(--panel); border-right: 1px solid var(--line); padding: 12px 10px; overflow: auto; }
.asidetop { display: flex; gap: 6px; margin-bottom: 6px; }
.asidetop input { flex: 1; min-width: 0; }
aside h2 { font-size: 11px; color: var(--faint); margin: 16px 8px 4px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; }
.reel { display: flex; align-items: center; gap: 8px; padding: 6px 8px; border-radius: var(--r); cursor: pointer; }
.reel:hover { background: var(--raise); }
.reel.cur { background: var(--raise2); }
.reel .name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.reel .meta { font-size: 11px; color: var(--faint); }
.badge { font-size: 11px; font-weight: 600; border-radius: 99px; padding: 0 7px; line-height: 18px; background: var(--raise2); color: var(--dim); }
.badge.wait { background: var(--mark); color: #fff; }
.badge.ans { background: var(--ask); color: #071225; }

/* ---------- кадр ---------- */
main { display: flex; flex-direction: column; min-width: 0; min-height: 0; padding: 12px 16px; gap: 8px; }
.stagewrap { flex: 1; min-height: 0; display: flex; justify-content: center; }
.stage { position: relative; width: 0; height: 0; background: #000; border-radius: 6px; overflow: hidden; overflow: clip; } /* размер — fitStage(); clip — не даёт прокрутить кадр к курсору поля */
.stage video, .stage canvas, .stage img.pv { position: absolute; inset: 0; width: 100%; height: 100%; }
.stage .pv { object-fit: contain; background: #000; }
.stage canvas { cursor: crosshair; }
.empty { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: var(--faint); }
.pvtag { position: absolute; left: 8px; top: 8px; z-index: 2; padding: 2px 10px; border-radius: 99px; border: 0; background: var(--ask);
  color: #071225; font-size: 11px; font-weight: 600; }
.pvtag:hover:not(:disabled) { background: #8dbcff; }
.tin { position: absolute; z-index: 3; min-width: 120px; padding: 0 4px; border-radius: 4px; background: rgba(0,0,0,.55);
  border: 1px dashed var(--draft); font-weight: 700; line-height: 1.1; }

.timeline { position: relative; height: 30px; background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); cursor: pointer; flex: none; }
.timeline .range { position: absolute; top: 0; bottom: 0; background: rgba(255, 212, 0, .2); border-left: 2px solid var(--draft); border-right: 2px solid var(--draft); }
.timeline .mk { position: absolute; top: 4px; width: 10px; height: 10px; margin-left: -5px; border-radius: 50%; background: var(--mark); }
.timeline .mk.done { background: var(--ok); } .timeline .mk.question { background: var(--ask); }
.timeline .mk.accepted { background: var(--faint); } .timeline .mk.wontfix { background: var(--warn); }
.timeline .ph { position: absolute; top: 0; bottom: 0; width: 2px; background: #fff; margin-left: -1px; pointer-events: none; }

.toolbar { display: flex; align-items: center; gap: 6px; flex: none; flex-wrap: wrap; row-gap: 6px; }
.tright { display: flex; gap: 6px; margin-left: auto; }
.tc { min-width: 80px; padding: 0 4px; color: var(--dim); }
.rate { min-width: 40px; padding: 6px 6px; font-weight: 600; }
.rate.slow { color: var(--draft); }
.seg { display: inline-flex; gap: 2px; padding: 2px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; }
.seg button { border: 0; background: none; width: 30px; height: 30px; padding: 0; color: var(--dim); }
.seg button:hover:not(:disabled) { background: var(--raise); color: var(--text); }
.seg button.on { background: var(--raise2); color: var(--text); }
.seg .gap { width: 1px; margin: 4px 3px; background: var(--line); }
.swatches { display: inline-flex; gap: 3px; padding: 0 2px; }
.sw { width: 16px; height: 16px; padding: 0; border-radius: 50%; border: 2px solid var(--line2); }
.sw:hover:not(:disabled) { border-color: var(--dim); }
.sw.on { border-color: #fff; box-shadow: 0 0 0 2px var(--bg), 0 0 0 3px #fff; }
.spin svg { animation: spin 1s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* ---------- дорожки ---------- */
.tracks { display: grid; grid-template-columns: 34px 1fr; gap: 0 6px; flex: none; }
.trlabels { display: grid; grid-auto-rows: 20px; row-gap: 3px; }
.trlabels > * { display: flex; align-items: center; justify-content: center; color: var(--faint); }
.trlabels svg { width: 15px; height: 15px; }
.trlabels button { position: relative; padding: 0; border: 0; background: none; color: var(--faint); width: 100%; height: 20px; }
.trlabels button:hover:not(:disabled) { color: var(--text); background: none; }
.trlabels .cnt { position: absolute; right: -4px; top: -3px; min-width: 14px; padding: 0 3px; border-radius: 99px; background: var(--warn);
  color: #2a1a00; font-size: 11px; font-weight: 700; line-height: 14px; }
.trlabels .cnt.err { background: var(--mark); color: #fff; } .trlabels .cnt.stale { opacity: .45; }
.trscroll { overflow-x: auto; overflow-y: hidden; min-width: 0; }
.trinner { position: relative; min-width: 100%; display: grid; grid-auto-rows: 20px; row-gap: 3px; }
.lane { position: relative; background: var(--panel); border-radius: 4px; cursor: pointer; }
.it { position: absolute; top: 2px; bottom: 2px; min-width: 3px; border-radius: 3px; padding: 0 3px; overflow: hidden; white-space: nowrap;
  font-size: 11px; line-height: 16px; color: #111; cursor: pointer; }
.it.cut { background: #3a3f4a; color: var(--text); } .it.cut.alt { background: #4d5464; }
.it.ins { background: #6aa8ff; } .it.word { background: #d9dadd; } .it.word.edited { background: var(--ok); }
.lane.ro .it.word { background: #5b5e66; color: #d9dadd; cursor: default; }
.it.snd { background: var(--warn); cursor: grab; } .it.snd.missing { background: var(--mark); }
.it.chk { background: var(--mark); color: #fff; } .it.chk.warn { background: var(--warn); color: #2a1a00; }
.it.sel { outline: 2px solid #fff; z-index: 2; }
.trph { position: absolute; top: 0; bottom: 0; width: 2px; margin-left: -1px; background: #fff; pointer-events: none; z-index: 3; }
.insp { grid-column: 2; display: flex; align-items: center; gap: 8px; height: 38px; padding-top: 4px; overflow: hidden; white-space: nowrap; }
.insp input[type=text] { min-width: 220px; } .insp input[type=number] { width: 86px; }
.insp .what { color: var(--dim); max-width: 520px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* ---------- правая колонка ---------- */
.side { background: var(--panel); border-left: 1px solid var(--line); padding: 14px; overflow: auto; display: flex; flex-direction: column; gap: 16px; }
.reelhead { display: flex; align-items: center; gap: 8px; }
.reelhead .title { flex: 1; min-width: 0; font-size: 18px; font-weight: 700; letter-spacing: -.01em; }
.reelhead .title span { font-size: 11px; font-weight: 400; color: var(--faint); margin-left: 6px; letter-spacing: 0; }
.reelhead select { padding: 5px 8px; }

.claude { display: grid; gap: 8px; }
.chead { display: flex; align-items: center; gap: 8px; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--faint); }
.dot.run { background: var(--warn); animation: pulse 1.2s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .35; } }
.cacts { display: flex; flex-wrap: wrap; gap: 6px; }
.feed { display: grid; gap: 6px; max-height: 150px; overflow: auto; }
.feed:empty { display: none; }
.feed .tool { font: 11px/1.35 ui-monospace, Menlo, monospace; color: var(--faint); white-space: pre-wrap; word-break: break-all; }
.feed .txt { white-space: pre-wrap; }
.feed .ok { color: var(--ok); } .feed .err { color: var(--mark); } .feed .meta { color: var(--faint); font-size: 11px; }

.composer { display: grid; gap: 8px; }
.composer textarea { min-height: 76px; }
.ctx { display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--dim); }
.ctx .chip { display: inline-flex; align-items: center; gap: 4px; padding: 0 8px; line-height: 22px; border-radius: 99px; background: var(--raise); }
.ctx .chip.range { background: rgba(255, 212, 0, .16); color: var(--draft); }
.ctx button { width: 22px; height: 22px; padding: 0; border-radius: 50%; }
.ctx button svg { width: 13px; height: 13px; }
.cbtns { display: flex; gap: 6px; }
.cbtns .primary { flex: 1; }

#notes { display: grid; gap: 8px; }
.note { border: 1px solid var(--line); border-radius: 10px; padding: 10px 10px 10px 12px; background: var(--raise); cursor: pointer; }
.note:hover { border-color: var(--line2); }
.note.sel { border-color: var(--text); }
.note header { display: flex; align-items: center; gap: 8px; font-size: 11px; color: var(--dim); }
.note header button { margin: -6px -6px -6px auto; width: 28px; height: 28px; opacity: 0; }
.note:hover header button, .note.sel header button, .note header button:focus-visible { opacity: 1; }
.note .tx { margin: 6px 0 0; white-space: pre-wrap; }
.st { font-size: 11px; border-radius: 99px; padding: 0 8px; line-height: 18px; font-weight: 600; }
.st.new, .st.reopened { background: var(--mark); color: #fff; }
.st.done { background: var(--ok); color: #062814; } .st.question { background: var(--ask); color: #071225; }
.st.wontfix { background: var(--warn); color: #2a1a00; } .st.accepted { background: var(--raise2); color: var(--dim); }
.thread { border-left: 2px solid var(--line2); padding-left: 8px; margin: 8px 0 0; display: grid; gap: 4px; }
.thread b { color: var(--dim); font-weight: 600; }
.pics { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-top: 8px; }
.pics figure { margin: 0; } .pics img, .pics video { width: 100%; border-radius: 6px; display: block; background: #000; }
.pics figcaption { font-size: 11px; color: var(--faint); }
.acts { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
.other { font-size: 11px; color: var(--warn); margin-top: 4px; }
.rule { border: 1px dashed var(--ask); border-radius: var(--r); padding: 8px; margin-top: 8px; display: grid; gap: 6px; cursor: default; }
.rule textarea { min-height: 54px; }

/* ---------- окна ---------- */
dialog { border: 1px solid var(--line2); border-radius: 14px; background: var(--panel); color: var(--text); padding: 0; width: min(460px, 92vw);
  box-shadow: 0 24px 60px rgba(0,0,0,.55), 0 2px 8px rgba(0,0,0,.4); }
dialog::backdrop { background: rgba(0,0,0,.66); }
dialog form { display: grid; gap: 14px; padding: 18px; }
dialog h2 { margin: 0; font-size: 18px; letter-spacing: -.01em; }
.dbody { display: grid; gap: 10px; color: var(--dim); }
.dbody input { width: 100%; color: var(--text); }
.dbtns { display: flex; gap: 8px; justify-content: flex-end; }
.dbtns [value=cancel] { order: -1; }
.opt { display: grid; grid-template-columns: auto 1fr auto; gap: 2px 10px; align-items: center; padding: 10px 12px; border: 1px solid var(--line);
  border-radius: 10px; cursor: pointer; color: var(--text); }
.opt:has(input:checked) { border-color: var(--mark); background: rgba(255, 90, 54, .08); }
.opt input { margin: 0; accent-color: var(--mark); }
.opt small { grid-column: 2 / 4; color: var(--faint); font-size: 11px; word-break: break-all; }
dialog.wide { width: min(1180px, 96vw); }
.vargrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 14px; }
.vargrid figure { margin: 0; display: grid; gap: 8px; align-content: start; }
.vargrid img, .vargrid video { width: 100%; aspect-ratio: 9 / 16; object-fit: contain; background: #000; border-radius: 10px; }
.vargrid figcaption { color: var(--dim); }
.vargrid figcaption b { color: var(--text); margin-right: 4px; }
dialog.pic { width: auto; max-width: 94vw; background: none; border: 0; box-shadow: none; }
dialog.pic img { display: block; max-height: 92vh; max-width: 94vw; border-radius: 8px; }
.keys { display: grid; grid-template-columns: auto 1fr; gap: 6px 16px; color: var(--text); }
.keys dt { color: var(--dim); text-align: right; white-space: nowrap; }
.keys dd { margin: 0; }
kbd { font: 11px ui-monospace, Menlo, monospace; color: var(--text); border: 1px solid var(--line2); border-bottom-width: 2px; border-radius: 4px; padding: 0 5px; }

#tip { position: fixed; z-index: 30; max-width: 300px; padding: 7px 10px; border-radius: 8px; background: #2a2c32; border: 1px solid var(--line2);
  color: var(--text); line-height: 1.35; box-shadow: 0 8px 24px rgba(0,0,0,.45); pointer-events: none; opacity: 0; transform: translateY(-2px);
  transition: opacity .12s, transform .12s; }
#tip.show { opacity: 1; transform: none; }
#tip kbd { margin-left: 4px; }
.stage.busy::after { content: ""; position: absolute; z-index: 4; left: 50%; top: 50%; width: 40px; height: 40px; margin: -20px 0 0 -20px;
  border-radius: 50%; border: 3px solid rgba(255,255,255,.25); border-top-color: #fff; animation: spin .8s linear infinite; }
.stage.busy video { filter: brightness(.6); }
#toast { position: fixed; left: 50%; bottom: 20px; z-index: 20; transform: translate(-50%, 12px); max-width: min(640px, 90vw);
  padding: 9px 14px; border-radius: 10px; background: var(--raise2); border: 1px solid var(--line2);
  box-shadow: 0 10px 30px rgba(0,0,0,.45); opacity: 0; pointer-events: none; transition: opacity .18s, transform .25s cubic-bezier(.2, .9, .3, 1); }
#toast.show { opacity: 1; transform: translate(-50%, 0); }
#toast.err { background: #3a1611; border-color: #6b2a1d; color: #ffd2c6; }

@media (max-width: 1100px) {
  .app { grid-template-columns: 1fr; grid-template-rows: auto; height: auto; }
  aside { max-height: 200px; } .stagewrap { flex: none; height: min(75vh, calc((100vw - 32px) * 16 / 9)); }
  .toolbar { flex-wrap: wrap; }
}
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<div class="app">
  <aside>
    <div class="asidetop">
      <input id="filter" type="search" placeholder="Поиск" aria-label="Поиск роликов: id, бренд, статус">
      <button class="icon ghost" id="keysbtn" data-icon="keyboard" title="Горячие клавиши · ?" aria-label="Горячие клавиши"></button>
      <button class="icon ghost" id="openrules" data-icon="sliders" title="Правила и настройки — правила брендов, CLAUDE.md, каталог приёмов, модель Claude. Открывается отдельным окном" aria-label="Правила и настройки"></button>
    </div>
    <nav id="reels" aria-label="Ролики"></nav>
  </aside>

  <main>
    <div class="stagewrap">
      <div class="stage" id="stage">
        <video id="v" preload="auto" playsinline></video>
        <video class="pv" id="pvv" loop playsinline hidden></video>
        <canvas id="cv"></canvas>
        <button class="pvtag" id="pvtag" hidden title="Сейчас показан кадр из кода — клик вернёт мастер · V"></button>
        <input class="tin" id="tin" hidden aria-label="Текст на кадре">
      </div>
    </div>
    <div class="timeline" id="tl" title="Шкала: клик — перейти к кадру, Shift + протяжка — выделить отрезок. Точки — пометки"><div class="ph" id="ph"></div></div>
    <div class="toolbar">
      <button class="icon ghost" id="play" data-icon="play" title="Пуск / пауза · Пробел" aria-label="Пуск"></button>
      <span class="tc num" id="tc" title="Время в секундах и номер кадра мастера">—</span>
      <button class="ghost rate num" id="rate" title="Скорость просмотра — клик замедляет: ½×, ¼×, 0.1×, снова 1× · ⇧< ⇧>" aria-label="Скорость просмотра">1×</button>
      <div class="seg" id="tools" role="toolbar" aria-label="Отметки на кадре">
        <button data-tool="point" data-icon="point" title="Точка — отметить место на кадре · P" aria-label="Точка"></button>
        <button data-tool="rect" data-icon="rect" title="Рамка — обвести то, что поменять · R" aria-label="Рамка"></button>
        <button data-tool="arrow" data-icon="arrow" title="Стрелка — куда сдвинуть или как должно двигаться · A" aria-label="Стрелка"></button>
        <span class="gap"></span>
        <button data-tool="pen" data-icon="pen" title="Кисть — эскиз новой графики от руки, Claude сделает по нему настоящую · B" aria-label="Кисть"></button>
        <button data-tool="plate" data-icon="plate" title="Плашка — эскиз залитой плашки: место, размер, цвет · F" aria-label="Плашка"></button>
        <button data-tool="text" data-icon="text" title="Текст — написать на кадре слова для новой графики · T" aria-label="Текст"></button>
      </div>
      <div class="swatches" id="swatches" hidden></div>
      <div class="tright">
      <button class="icon ghost" id="grid" data-icon="grid" title="Сетка кадра — зоны из настроек проекта · G" aria-label="Сетка кадра"></button>
      <button class="icon ghost" id="pvbtn" data-icon="eye" title="Предпросмотр — этот кадр (или отрезок I–O) таким, каким он сейчас получается из кода, без рендера мастера. Около 5 секунд · V" aria-label="Предпросмотр из кода"></button>
      </div>
    </div>
    <div class="tracks" id="tracks" hidden>
      <div class="trlabels">
        <span data-icon="scissors" title="Склейки — куски дублей в нарезке"></span>
        <span data-icon="layers" title="Вставки — перебивки и графика из плана ролика"></span>
        <span data-icon="captions" id="wordslabel" title="Слова субтитров — клик по слову, чтобы исправить опечатку"></span>
        <span data-icon="wave" title="Звуки — тянуть блок, чтобы сдвинуть; громкость — в строке под дорожками"></span>
        <button id="t-check" data-icon="alert" title="Проверка мастера: хвосты, вдохи, повторы, логотип, сведены ли звуки. Около 5 секунд · C" aria-label="Проверить мастер"></button>
      </div>
      <div class="trscroll" id="trscroll"><div class="trinner" id="trinner"></div></div>
      <div class="insp" id="insp"></div>
    </div>
  </main>

  <section class="side">
    <header class="reelhead" id="reelhead" hidden>
      <div class="title" id="rtitle"></div>
      <select id="status" aria-label="Статус ролика"></select>
      <button class="icon ghost" id="del" data-icon="trash" title="Удалить мастер или весь ролик в Корзину · ⌘⌫" aria-label="Удалить"></button>
    </header>

    <div class="claude" id="claudebox" hidden>
      <div class="chead">
        <span class="dot" id="cdot"></span><b>Claude</b><span class="dim small" id="cstate"></span>
        <span class="grow"></span>
        <button class="icon ghost" id="c-stop" data-icon="stop" hidden title="Остановить Claude" aria-label="Остановить Claude"></button>
        <button class="icon ghost" id="c-new" data-icon="refresh" title="Новая сессия — Claude забудет разговор об этом ролике" aria-label="Новая сессия Claude"></button>
      </div>
      <div class="cacts">
        <button class="primary" id="c-notes" hidden title="Claude внесёт все ждущие пометки и покажет «после» из кода"></button>
        <button id="c-varshow" hidden title="Открыть три варианта и выбрать один">Выбрать вариант</button>
        <button id="c-rules" hidden title="Claude предложит строки в правила из принятых и возвращённых пометок; записываете вы"></button>
        <button class="primary" id="apply" data-icon="toMaster" hidden><span>В мастер</span></button>
        <button id="c-build" title="Собрать версию — полный рендер, мастер звука, звуки и проверка. Несколько минут">Собрать версию</button>
      </div>
      <div class="feed" id="feed" aria-live="polite"></div>
    </div>

    <div class="composer" id="composer" hidden>
      <textarea id="txt" placeholder="Что поменять?" aria-label="Пометка или задание Claude"></textarea>
      <div class="ctx" id="where"></div>
      <div class="cbtns">
        <button class="primary" id="add" title="Добавить пометку на этот кадр · ⌘Enter">Добавить</button>
        <button id="addgo" title="Добавить и сразу отдать Claude в работу · ⌘⇧Enter">Сделать</button>
        <button id="addvar" title="Три варианта — Claude сделает их по тексту, вы выберете по кадрам · ⌘⌥Enter">3 варианта</button>
      </div>
    </div>

    <div id="notes"></div>
  </section>
</div>

<dialog id="dlg"></dialog>
<dialog id="vardlg" class="wide"><form method="dialog">
  <div style="display:flex;align-items:center;gap:8px"><h2 id="vartitle" class="grow"></h2><button value="base" id="varbase">Оставить как было</button><button value="close" class="icon ghost" data-icon="x" aria-label="Закрыть"></button></div>
  <div class="vargrid" id="vargrid"></div>
</form></dialog>
<dialog id="picdlg" class="pic"><form method="dialog"><button value="close" style="all:unset;cursor:zoom-out" id="picbtn" aria-label="Закрыть"></button></form></dialog>
<div id="toast" role="status"></div>

<script>
// ---------- иконки: свои SVG, один штрих ----------
const ICONS = {
  play: '<path d="M8 5.5v13l10.5-6.5z" fill="currentColor" stroke="none"/>',
  pause: '<rect x="7" y="5.5" width="3.6" height="13" rx="1" fill="currentColor" stroke="none"/><rect x="13.4" y="5.5" width="3.6" height="13" rx="1" fill="currentColor" stroke="none"/>',
  point: '<circle cx="12" cy="12" r="7"/><circle cx="12" cy="12" r="1.6" fill="currentColor"/>',
  rect: '<rect x="4.5" y="6.5" width="15" height="11" rx="1"/>',
  arrow: '<path d="M5 19L19 5M10 5h9v9"/>',
  pen: '<path d="M3 15c2-5 4-5 6 0s4 5 6 0 4-5 6 0"/>',
  plate: '<rect x="4" y="8" width="16" height="8" rx="3" fill="currentColor" stroke="none"/>',
  text: '<path d="M6 6h12M12 6v13"/>',
  grid: '<rect x="5" y="3" width="14" height="18" rx="1.5"/><rect x="8" y="6.5" width="8" height="10" rx=".5" stroke-dasharray="2 2"/>',
  eye: '<path d="M2.5 12s3.5-6.5 9.5-6.5 9.5 6.5 9.5 6.5-3.5 6.5-9.5 6.5S2.5 12 2.5 12z"/><circle cx="12" cy="12" r="2.8"/>',
  keyboard: '<rect x="3" y="6" width="18" height="12" rx="2"/><path d="M7 10h.01M11 10h.01M15 10h.01M8 14h8"/>',
  sliders: '<path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/>',
  trash: '<path d="M4 7h16M10 11v6M14 11v6M6 7l1 12.5a1.5 1.5 0 0 0 1.5 1.5h7a1.5 1.5 0 0 0 1.5-1.5L18 7M9 7V4.5h6V7"/>',
  refresh: '<path d="M4 12a8 8 0 0 1 14-5.3L20 9M20 4v5h-5M20 12a8 8 0 0 1-14 5.3L4 15M4 20v-5h5"/>',
  stop: '<rect x="7" y="7" width="10" height="10" rx="1.5" fill="currentColor" stroke="none"/>',
  scissors: '<circle cx="6.5" cy="7" r="2.5"/><circle cx="6.5" cy="17" r="2.5"/><path d="M8.6 8.4L20 18M8.6 15.6L20 6"/>',
  layers: '<path d="M12 4l8 4-8 4-8-4z"/><path d="M4 12l8 4 8-4"/><path d="M4 16l8 4 8-4"/>',
  captions: '<rect x="3" y="5.5" width="18" height="13" rx="2"/><path d="M7 14h5M14 14h3M7 10.5h10"/>',
  wave: '<path d="M4 10v4M8 7v10M12 4v16M16 8v8M20 11v2"/>',
  alert: '<path d="M12 4l9 16H3z"/><path d="M12 10v4M12 17.2h.01"/>',
  x: '<path d="M6 6l12 12M18 6L6 18"/>',
  toMaster: '<path d="M12 4v11M7.5 10.5L12 15l4.5-4.5M4 16v3a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-3"/>',
  minus: '<path d="M6 12h12"/>', plus: '<path d="M6 12h12M12 6v12"/>',
};
const icon = (n) => `<svg viewBox="0 0 24 24" aria-hidden="true">${ICONS[n]}</svg>`;
document.querySelectorAll("[data-icon]").forEach((el) => el.insertAdjacentHTML("afterbegin", icon(el.dataset.icon)));

const STATUS = { new: "новая", reopened: "возвращена", done: "сделано", question: "вопрос", wontfix: "не будем", accepted: "принято" };
const STATUSES = ["в работе", "сдан", "опубликован", "отложен", "не закончен"];
const GRAPHIC = new Set(["pen", "plate", "text"]);
const W = 1080, H = 1920;
const $ = (s) => document.querySelector(s);
const v = $("#v"), cv = $("#cv"), ctx = cv.getContext("2d");
v.after(Object.assign(document.createElement("img"), { className: "pv", id: "pv", alt: "Кадр из текущего кода", hidden: true }));
const S = { reels: [], reel: null, fps: 30, dur: 0, doc: { notes: [] }, docJson: "", tool: "point",
  draft: [], range: [null, null], grid: false, sel: null, drag: null, reopen: null, color: "#ffd400", colors: {},
  pv: null, feed: [], feedN: 0, job: null, session: null };

const api = async (path, body) => {
  const r = await fetch(path, body ? { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) } : {});
  if (!r.ok) throw new Error((await r.json().catch(() => ({}))).error || r.status);
  return r.json();
};
const media = (p) => "/media/" + p.split("/").map(encodeURIComponent).join("/");
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const frame = () => Math.floor(v.currentTime * S.fps + 1e-4);
const nframes = () => Math.max(1, Math.round(S.dur * S.fps));
const seek = (f) => { f = Math.max(0, Math.min(nframes() - 1, f)); v.currentTime = (f + 0.5) / S.fps; };
const secs = (f) => (f / S.fps).toFixed(2);
const plural = (n, one, few, many) => n % 10 === 1 && n % 100 !== 11 ? one : [2, 3, 4].includes(n % 10) && ![12, 13, 14].includes(n % 100) ? few : many;
const mb = (n) => n > 1e9 ? (n / 1e9).toFixed(1) + " ГБ" : Math.max(0.1, n / 1e6).toFixed(1) + " МБ";
const reelArgs = () => ({ brand: S.reel.brand, id: S.reel.id });
const q = (o) => new URLSearchParams(o).toString();

// ---------- уведомления и окна (нативный <dialog>: Esc, фокус, фон) ----------
function toast(t, err) {
  const el = $("#toast"); el.textContent = t; el.className = "show" + (err ? " err" : "");
  clearTimeout(toast.t); toast.t = setTimeout(() => (el.className = err ? "err" : ""), err ? 6000 : 1800);
}
const flash = (t) => toast(t);
const fail = (e) => toast(String(e?.message || e), true);
function ask({ title, body = "", ok = "Да", danger = false }) {
  const d = $("#dlg");
  // «ок» первым в разметке — Enter в поле подтверждает; у удаления фокус на «Отмене»
  d.innerHTML = `<form method="dialog"><h2>${esc(title)}</h2>${body ? `<div class="dbody">${body}</div>` : ""}
    <div class="dbtns"><button value="ok" class="${danger ? "danger" : "primary"}">${esc(ok)}</button><button value="cancel" formnovalidate>Отмена</button></div></form>`;
  d.returnValue = "";
  d.showModal();
  (danger ? d.querySelector("[value=cancel]") : d.querySelector("input:not([type=radio]), textarea") || d.querySelector("[value=ok]")).focus();
  return new Promise((res) => d.addEventListener("close", () =>
    res(d.returnValue === "ok" ? Object.fromEntries(new FormData(d.querySelector("form"))) : null), { once: true }));
}
const anyDialog = () => document.querySelector("dialog[open]");

// ---------- ролики ----------
async function loadReels() {
  S.reels = await api("/api/reels");
  if (S.reel) {
    const fresh = S.reels.find((r) => r.path === S.reel.path);
    if (fresh && fresh.mtime !== S.reel.mtime) {  // новый мастер (сборка, «в мастер»): тот же кадр, новое видео
      const f = frame(); S.reel = fresh;
      v.addEventListener("loadedmetadata", () => { S.dur = v.duration || S.dur; seek(f); loadTracks(); }, { once: true });
      v.src = media(fresh.path) + "?v=" + fresh.mtime;
      flash("новый мастер");
    } else if (fresh) S.reel = fresh;
  }
  drawReels(); drawHead();
}
function drawReels() {
  const qs = $("#filter").value.trim().toLowerCase();
  const byBrand = {};
  for (const r of S.reels) {
    if (qs && !(r.id + " " + r.brand + " " + r.file + " " + r.status).toLowerCase().includes(qs)) continue;
    (byBrand[r.brand] ??= []).push(r);
  }
  $("#reels").innerHTML = Object.entries(byBrand).map(([b, rs]) => `<h2>${esc(b)}</h2>` + rs.map((r) => {
    const cur = S.reel && S.reel.path === r.path ? " cur" : "";
    const d = new Date(r.mtime * 1000).toLocaleString("ru", { day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" });
    const badge = r.waiting ? `<span class="badge wait" title="ждут Claude">${r.waiting}</span>`
      : r.answered ? `<span class="badge ans" title="Claude ответил">${r.answered}</span>` : r.notes ? `<span class="badge">${r.notes}</span>` : "";
    return `<div class="reel${cur}" data-path="${esc(r.path)}" title="${esc(r.file)} · ${d}"><span class="name">${esc(r.file.replace(/\.mp4$/, ""))}</span><span class="meta">${esc(r.status)}</span>${badge}</div>`;
  }).join("")).join("") || `<div class="dim small" style="padding:8px">Мастеров нет</div>`;
}
$("#reels").addEventListener("click", (e) => { const el = e.target.closest(".reel"); if (el) openReel(S.reels.find((r) => r.path === el.dataset.path)); });
$("#filter").addEventListener("input", drawReels);

// ---------- отмена: ⌘Z возвращает последнее действие на этом ролике ----------
const UNDO = [];
function undoable(label, undo) { UNDO.push({ label, undo }); if (UNDO.length > 200) UNDO.shift(); }
async function undoLast() {
  const u = UNDO.pop();
  if (!u) return flash("отменять нечего");
  try { await u.undo(); flash("отменено: " + u.label); } catch (e) { fail(e); }
}
function addShape(s) {
  S.draft.push(s);
  undoable("отметка", () => { const i = S.draft.lastIndexOf(s); if (i >= 0) S.draft.splice(i, 1); draw(); where(); });
  draw(); where();
}
function setRange(r, prev = S.range.slice()) {
  S.range = r; drawTimeline(); where();
  undoable("отрезок", () => { S.range = prev; drawTimeline(); where(); });
}

// ---------- шапка ролика: статус (таблица роликов, отметки публикации, память) и удаление ----------
function drawHead() {
  const r = S.reel;
  $("#reelhead").hidden = $("#claudebox").hidden = $("#composer").hidden = !r;
  if (!r) return;
  $("#status").hidden = !S.feat?.status;
  $("#grid").hidden = !(S.feat?.grid || []).length;  // сетки нет в настройках — нет и кнопки  // без таблицы статусов в настройках проекта — без статуса
  const file = r.file.replace(/\.mp4$/, "");
  $("#rtitle").innerHTML = esc(r.key) + `<span>${esc([file !== r.key && file, r.version].filter(Boolean).join(" · "))}</span>`;
  const sel = $("#status");
  if (document.activeElement !== sel) {
    sel.innerHTML = (r.status ? "" : `<option value="">без статуса</option>`) + STATUSES.map((s) => `<option>${s}</option>`).join("");
    sel.value = r.status || "";
    const p = r.published || {};
    sel.title = r.status === "опубликован" ? [p["Опубликован"], p["Ссылка"], p["Результат"]].filter(Boolean).join(" · ") : "Статус в таблице роликов";
  }
  $("#pvbtn").disabled = !r.preview;
  $("#c-notes").hidden = !r.waiting;
  $("#c-notes").textContent = `Внести ${r.waiting} ${plural(r.waiting, "пометку", "пометки", "пометок")}`;
}
$("#status").addEventListener("change", async (e) => {
  const s = e.target.value, r = S.reel;
  let body = { status: s };
  if (s === "опубликован") {
    const p = r.published || {};
    const date = /^\d{1,2}\.\d{1,2}(\.\d{2,4})?$/.test(p["Опубликован"] || "") ? p["Опубликован"] : new Date().toLocaleDateString("ru", { day: "2-digit", month: "2-digit" });
    const got = await ask({ title: `${r.key} опубликован`, ok: "Отметить", body:
      `<input name="link" placeholder="Ссылка" value="${esc(p["Ссылка"] || "")}" aria-label="Ссылка на публикацию">
       <input name="date" placeholder="Дата" value="${esc(date)}" aria-label="Дата публикации">
       <input name="result" placeholder="Просмотры, заявки" value="${esc(p["Результат"] || "")}" aria-label="Результат">
       <span class="small">После следующего ответа Claude рабочие файлы ролика уйдут в Корзину; мастер и тексты останутся.</span>` });
    if (!got) return drawHead(e.target.value = r.status || "");
    body = { ...body, ...got };
  } else if (r.status === "опубликован" && !(await ask({ title: `Снять отметку публикации ${r.key}?`, ok: "Снять",
      body: "Отметка публикации будет снята. Файлы, уже унесённые в Корзину, вернуть оттуда вручную." }))) {
    return (e.target.value = r.status);
  }
  try { await api("/api/status", { ...reelArgs(), ...body }); e.target.blur(); await loadReels(); flash("статус записан"); } catch (err) { fail(err); }
});

async function delReel() {
  const r = S.reel; if (!r) return;
  try {
    const base = { ...reelArgs(), file: r.file, dry: true };
    const [f, all] = await Promise.all([api("/api/reel/delete", { ...base, scope: "file" }), api("/api/reel/delete", { ...base, scope: "reel" })]);
    const size = (p) => mb(p.items.reduce((s, i) => s + i.size, 0));
    const list = (p) => p.items.map((i) => esc(i.path.split("/").slice(-2).join("/"))).join(", ");
    const got = await ask({ title: "Удалить в Корзину", ok: "Удалить", danger: true, body:
      `<label class="opt"><input type="radio" name="scope" value="file" checked><span>Мастер ${esc(r.file)}</span><span class="num">${size(f)}</span></label>
       <label class="opt"><input type="radio" name="scope" value="reel"><span>Весь ролик ${esc(r.id)}</span><span class="num">${size(all)}</span>
         <small>${list(all)}${all.row ? ", строка в таблице роликов" : ""}${all.keep.length ? ` · код остаётся: ${esc(all.keep.join(", "))}` : ""}</small></label>` });
    if (!got) return;
    await api("/api/reel/delete", { ...reelArgs(), file: r.file, scope: got.scope, dry: false });
    toast("в Корзине — вернуть можно оттуда");
    S.reel = null; v.removeAttribute("src"); v.load(); hidePreview(); $("#tracks").hidden = true; $("#notes").innerHTML = "";
    history.replaceState(null, "", "#"); drawHead(); await loadReels();
  } catch (e) { fail(e); }
}
$("#del").onclick = delReel;
$("#openrules").onclick = () => window.open("/rules", "reel-rules", "width=1150,height=900");

async function openReel(r, atFrame) {
  if (!r) return;
  UNDO.length = 0;  // отмена — в пределах ролика
  S.reel = r; S.draft = []; S.range = [null, null]; S.sel = null; S.feed = []; S.feedN = 0; $("#feed").innerHTML = "";
  hidePreview(); drawHead(); drawSwatches(); loadFeed();
  const info = await api("/api/info?" + q({ path: r.path }));
  S.fps = info.fps || 30; S.dur = info.dur;
  T.sel = null; T.data = null; $("#tracks").hidden = true; $("#vardlg").open && $("#vardlg").close();
  // обработчик — до src: из кэша метаданные приходят раньше, чем закончится loadNotes, и событие терялось
  v.addEventListener("loadedmetadata", () => { S.dur = v.duration || S.dur; seek(atFrame ?? 0); loadTracks(); loadVariants(false); }, { once: true });
  v.src = media(r.path) + "?v=" + r.mtime;
  history.replaceState(null, "", `#${encodeURIComponent(r.brand)}/${encodeURIComponent(r.file)}`);
  await loadNotes();
  drawReels(); where();
}

// ---------- пометки ----------
async function loadNotes() {
  if (!S.reel) return;
  const doc = await api("/api/notes?" + q(reelArgs()));
  const j = JSON.stringify(doc);
  if (j === S.docJson) return;
  S.doc = doc; S.docJson = j;
  drawNotes(); draw(); drawTimeline();
}
async function saveNote(note) {
  const doc = await api("/api/note", { ...reelArgs(), note });
  S.doc = doc; S.docJson = JSON.stringify(doc);
  drawNotes(); draw(); drawTimeline();
  loadReels();
}
async function addNote(go) {
  if (!S.reel) return;
  const text = $("#txt").value.trim();
  if (!text && !S.draft.length) { $("#txt").focus(); return flash("напишите, что поменять"); }
  const range = S.range[0] != null && S.range[1] != null ? [Math.min(...S.range), Math.max(...S.range)] : null;
  const f = range ? range[0] : frame();
  // вид пометки — из того, что на кадре: эскиз графики, отрезок или просто место
  const kind = S.draft.some((s) => s.kind === "g") ? "draw" : range ? "timing" : "other";
  const id = "n" + Date.now().toString(36), draft = S.draft, prevRange = S.range;
  try {
    await saveNote({ id, master: S.reel.file, master_path: S.reel.path, master_mtime: S.reel.mtime,
      fps: S.fps, frame: f, t: +(f / S.fps).toFixed(3), range, kind, shapes: S.draft.map(({ kind, ...s }) => s), text, status: "new" });
  } catch (e) { return fail(e); }
  clearDraft(false); $("#txt").value = "";
  undoable("пометка", async () => {  // убрать пометку и вернуть в поле текст и отметки
    await removeNote(id);
    if (!$("#txt").value.trim()) $("#txt").value = text;
    S.draft = draft; S.range = prevRange; drawTimeline(); draw(); where();
  });
  if (go) runClaude("notes"); else flash("пометка добавлена");
}
async function addVariants() {
  const t = $("#txt").value.trim();
  if (!t) { $("#txt").focus(); return flash("напишите, что сделать в трёх вариантах"); }
  if (await runClaude("variants", t)) { $("#txt").value = ""; clearDraft(false); }
}
function clearDraft(record = true) {
  if (record && (S.draft.length || S.range[0] != null)) {
    const draft = S.draft, range = S.range;
    undoable("сброс отметок", () => { S.draft = draft; S.range = range; drawTimeline(); draw(); where(); });
  }
  S.draft = []; S.range = [null, null]; drawTimeline(); draw(); where();
}
function where() {
  if (!S.reel) return;
  const f = frame(), [a, b] = S.range, n = S.draft.length;
  const place = a != null ? `<span class="chip range num" title="Пометка ляжет на этот отрезок кадров (I / O)">${Math.min(a, b ?? a)}–${b != null ? Math.max(a, b) : "…"}</span>`
    : `<span class="chip num" title="Пометка ляжет на этот кадр">кадр ${f}</span>`;
  const html = place + (n ? `<span class="chip">${n} ${plural(n, "отметка", "отметки", "отметок")}</span>` : "")
    + (n || a != null ? `<button class="ghost" id="clearbtn" title="Сбросить отметки и отрезок · X" aria-label="Сбросить отметки">${icon("x")}</button>` : "");
  if (html !== where.last) $("#where").innerHTML = where.last = html;  // tick зовёт каждый кадр — перерисовывать только при смене
}
$("#where").addEventListener("click", (e) => e.target.closest("#clearbtn") && clearDraft());

function drawNotes() {  // перерисовка не теряет набранное в «Вернуть» и в тексте правила
  const keep = [...document.querySelectorAll("#notes textarea")].map((t) => [t.dataset.reopen ? "reopen:" + t.dataset.reopen : "rule:" + t.dataset.rule, t.value, document.activeElement === t]);
  drawNotesNow();
  for (const [k, val, focus] of keep) {
    const [kind, id] = k.split(":");
    const t = document.querySelector(`#notes textarea[data-${kind}="${id}"]`);
    if (t) { t.value = val; if (focus) t.focus(); }
  }
  drawRulesBtn();
}
function ruleBox(n) {
  const r = n.rule;
  if (!r) return "";
  if (r.status === "proposed") return `<div class="rule"><span class="small dim">Правило → ${esc(r.file.replace(/\/brands\/[^/]+\//, " / "))}</span>
    <textarea data-rule="${esc(n.id)}">${esc(r.text)}</textarea>
    <div class="acts" style="margin:0"><button class="primary" data-act="rule-ok" data-id="${esc(n.id)}" title="Дописать это правило в файл">Записать</button><button data-act="rule-no" data-id="${esc(n.id)}" title="Не записывать">Не надо</button></div></div>`;
  if (r.status === "written") return `<div class="small" style="color:var(--ok);margin-top:6px">правило записано</div>`;
  return "";
}

// ---------- рисование на кадре ----------
function toFrame(e) {

cv.addEventListener("mousedown", (e) => {

  if (S.tool === "text") { e.preventDefault(); return textAt(e, p); }  // иначе щелчок сразу снимает фокус с поля
  S.drag = { x0: p.x, y0: p.y, x1: p.x, y1: p.y, pts: S.tool === "pen" ? [[p.x, p.y]] : null };
});
function textAt(e, p) {  // текст эскиза вводится прямо на кадре
  const tin = $("#tin"), st = $("#stage").getBoundingClientRect(), k = st.width / W, size = 64;
  Object.assign(tin.style, { left: e.clientX - st.left + "px", top: e.clientY - st.top + "px", fontSize: size * k + "px", color: S.color });
  tin.value = ""; tin.hidden = false; tin.dataset.x = p.x; tin.dataset.y = p.y;
  tin.focus();  // сразу: mousedown отменён, фокус никто не уведёт, и первые буквы не теряются
}
function textDone(keep) {

$("#tin").addEventListener("keydown", (e) => { e.stopPropagation(); if (e.key === "Enter") textDone(true); if (e.key === "Escape") textDone(false); });
$("#tin").addEventListener("blur", () => textDone(true));

  const small = Math.hypot(d.x1 - d.x0, d.y1 - d.y0) < 12;
  if (d.pts) { if (d.pts.length > 1) addShape({ type: "pen", pts: d.pts, w: 8, color: S.color, kind: "g" }); else draw(); }

  else if (S.tool === "plate" && Math.min(box.w, box.h) >= 12) addShape({ type: "rect", ...box, fill: true, color: S.color, kind: "g" });
  else if (S.tool === "rect" && Math.min(box.w, box.h) >= 12) addShape({ type: "rect", ...box });

function shape(s, color, k, label) {

  }

  if (s.type === "rect" && s.fill) { ctx.beginPath(); ctx.roundRect(s.x * k, s.y * k, s.w * k, s.h * k, 24 * k); ctx.fill(); }
  if (s.type === "point") { ctx.beginPath(); ctx.arc(s.x * k, s.y * k, 14 * devicePixelRatio, 0, 7); ctx.stroke(); ctx.beginPath(); ctx.arc(s.x * k, s.y * k, 3 * devicePixelRatio, 0, 7); ctx.fill(); }

  }

    const x = (s.x ?? s.x1 ?? s.pts[0][0]) * k, y = (s.y ?? s.y1 ?? s.pts[0][1]) * k - 8 * devicePixelRatio;

function draw() {

}

  const f = frame();

  if (it.t === "text") return `<div class="txt">${esc(it.text)}</div>`;

  if (it.t === "reset") return `<div class="meta">${at} · новая сессия</div>`;

const T = { data: null, zoom: 1, sel: null, drag: null, snd: null };

async function loadTracks() {

  try { T.data = await api("/api/tracks?" + q({ ...reelArgs(), path: r.path })); } catch { T.data = null; }

function trItem(cls, x, key, label, title) {

  return `<div class="it ${cls}${T.sel === key ? " sel" : ""}" data-k="${key}" style="left:${pct(x.t0)};width:${(w / S.dur) * 100}%" title="${esc(title)}">${esc(label)}</div>`;
}
function drawTracks() {
  const d = T.data; if (!d) return;

    d.cuts.map((c, i) => trItem("cut" + (i % 2 ? " alt" : ""), c, "cut:" + i, c.label, `${c.label} ${c.t0.toFixed(2)}–${c.t1.toFixed(2)} с — ${c.what}`)),
    d.inserts.map((x, i) => trItem("ins", x, "ins:" + i, `${x.label} ${x.what}`, `${x.label} ${x.t0.toFixed(2)}–${x.t1.toFixed(2)} с — ${x.what}`)),

const TOOLKEYS = { KeyP: "point", KeyR: "rect", KeyA: "arrow", KeyB: "pen", KeyF: "plate", KeyT: "text" };
window.addEventListener("keydown", (e) => {
  if (anyDialog()) return;  // у окон свои клавиши: Esc, Enter, Tab
  const mod = e.metaKey || e.ctrlKey;
  if (e.target.matches("textarea, input, select")) {
    if (e.target.id === "txt" && e.key === "Enter" && mod) { e.preventDefault(); e.altKey ? addVariants() : addNote(e.shiftKey); }

  if (mod || e.altKey) return;
  if (c === "Space") { e.preventDefault(); v.paused ? v.play() : v.pause(); }
  else if (e.shiftKey && c === "Comma") stepRate(-1);
  else if (e.shiftKey && c === "Period") stepRate(1);
  else if (c === "ArrowLeft") { e.preventDefault(); v.pause(); seek(frame() - step); }
  else if (c === "ArrowRight") { e.preventDefault(); v.pause(); seek(frame() + step); }
  else if (c === "ArrowUp") { e.preventDefault(); stepNote(-1); }

  else if (c === "Backspace" || c === "Delete") {

    if (S.draft.length) { const s = S.draft.pop(); undoable("удаление отметки", () => { S.draft.push(s); draw(); where(); }); draw(); where(); }

  tip.className = "show";
  const r = el.getBoundingClientRect(), w = tip.offsetWidth, h = tip.offsetHeight;
  const y = r.bottom + 8 + h > innerHeight - 8 ? r.top - h - 8 : r.bottom + 8;
  tip.style.left = Math.max(8, Math.min(innerWidth - w - 8, r.left + r.width / 2 - w / 2)) + "px"; tip.style.top = y + "px";
}
function tipHide() { clearTimeout(tipT); tipEl = null; tip.className = ""; }
document.addEventListener("pointerover", (e) => {
  const el = e.target.closest("[title], [data-tip]");
  if (el === tipEl) return;
  tipHide(); if (!el) return;
  if (el.title) { el.dataset.tip = el.title; el.removeAttribute("title"); }
  tipEl = el; tipT = setTimeout(() => tipEl === el && tipShow(el), 350);
});
for (const ev of ["pointerdown", "scroll", "keydown"]) document.addEventListener(ev, tipHide, true);
document.addEventListener("focusin", (e) => { const el = e.target; if (el.matches?.(":focus-visible") && (el.title || el.dataset?.tip)) { tipEl = el; tipShow(el); } });
document.addEventListener("focusout", tipHide);

// ---------- старт и ссылки: #<бренд>/<файл>[@кадр] ----------
function fromHash() {
  const m = decodeURIComponent(location.hash.slice(1)).match(/^(.+?)\/(.+?\.mp4)(?:@(\d+))?$/);
  const r = m && S.reels.find((x) => x.brand === m[1] && x.file === m[2]);
  if (!r) return false;
  if (S.reel && S.reel.path === r.path) { v.pause(); seek(m[3] ? +m[3] : frame()); }
  else openReel(r, m[3] ? +m[3] : 0);
  return true;
}
window.addEventListener("hashchange", fromHash);
(async () => {
  S.colors = await api("/api/brands").catch(() => ({}));
  S.feat = await api("/api/features").catch(() => ({ status: true }));
  await loadReels();
  if (!fromHash()) $("#stage").insertAdjacentHTML("beforeend", `<div class="empty" id="pick">Выберите ролик</div>`);
  setInterval(loadNotes, 4000);
  setInterval(loadReels, 5000);  // статусы, новые мастера и удалённые ролики — из файлов, что бы их ни поменяло
  (function poll() { loadFeed().catch(() => {}).finally(() => setTimeout(poll, S.job ? 1500 : 5000)); })();
})();
v.addEventListener("loadeddata", () => $("#pick")?.remove());
</script>
</body>
